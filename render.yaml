services:
  - type: web
    name: darkroom-steganography
    env: docker
    region: oregon
    plan: free
    dockerfilePath: Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: MAX_IMAGE_PIXELS
        value: "8000000"
